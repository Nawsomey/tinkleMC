<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TinkleChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="chat-container">
    <div id="settings-container">
      <label>Username:
        <input type="text" id="username" placeholder="Enter your username" />
      </label>
      <label>Background:
        <input type="color" id="chat-bg-color" />
      </label>
      <label>Dark Mode:
        <input type="checkbox" id="dark-mode-toggle" />
      </label>
    </div>

    <div id="messages"></div>

    <form id="message-form">
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Admin Access Button -->
  <div id="admin-button">
    <button id="admin-access">🔐</button>
  </div>

  <!-- Admin Modal -->
  <div id="admin-modal" class="modal" style="display: none;">
    <h3>Enter Admin Password</h3>
    <input type="password" id="admin-password" placeholder="••••••••" />
    <button id="verify-admin">Verify</button>
    <button id="close-admin">Close</button>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
